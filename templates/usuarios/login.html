{% extends "base.html" %}{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}<div class="tarjeta tarjeta-form "><div class="card-body p-4 p-md-5">
<div class="icono-titulo"><i class="bi bi-box-arrow-in-right"></i></div>
<h3>Iniciar sesión</h3>
<p class="text-muted">Ingresa con tu usuario y contraseña.</p>
<form method="post" novalidate>{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">{% include "_form.html" %}<button class="btn btn-primary w-100 mt-4 btn-lg">Ingresar</button></form>
<p class="mt-3 mb-0 text-center">¿No tienes cuenta? <a href="{% url 'usuarios:registro' %}">Regístrate</a></p>
</div></div>{% endblock %}
