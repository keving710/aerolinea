{% extends "base.html" %}{% block titulo %}Registro de cliente{% endblock %}
{% block contenido %}<div class="tarjeta tarjeta-form ancha"><div class="card-body p-4 p-md-5">
<div class="icono-titulo"><i class="bi bi-person-plus"></i></div>
<h3>Registro de cliente</h3>
<p class="text-muted">Crea tu cuenta para comprar y reservar tiquetes.</p>
<form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}{% include "_form.html" %}<button class="btn btn-primary w-100 mt-4 btn-lg">Registrarme</button></form>
<p class="mt-3 mb-0 text-center">¿Ya tienes cuenta? <a href="{% url 'usuarios:login' %}">Inicia sesión</a></p>
</div></div>{% endblock %}
