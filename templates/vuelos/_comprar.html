{% if not user.is_authenticated or user.es_cliente %}
<div class="d-flex gap-2 mt-2">
  <a class="btn btn-primary flex-fill" href="{% url 'reservas:iniciar' v.codigo 'comprar' %}"><i class="bi bi-cart3 me-1" aria-hidden="true"></i>Comprar</a>
  <a class="btn btn-outline-primary flex-fill" href="{% url 'reservas:iniciar' v.codigo 'reservar' %}"><i class="bi bi-bookmark me-1" aria-hidden="true"></i>Reservar</a>
</div>
{% if not user.is_authenticated %}<p class="small text-muted mt-2 mb-0">Para comprar o reservar debes <a href="{% url 'usuarios:registro' %}">registrarte</a>.</p>{% endif %}
{% endif %}
